<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
    <title>CDS</title>
    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
</head>
<body>
    <table cellspacing="0" cellpadding="0" border="0" align="center" style="width:600px;max-width:100%;border:3px solid #ddd;margin-top:25px;margin-bottom:25px;table-layout:fixed">
        <tbody>
            <tr>
                <td style="padding:10px;">
                    <p style="font-family: Calibri, Helvetica, sans-serif;font-size:12pt;line-height:17pt;margin-top:0;margin-bottom:10px;color:#444"></p>
                    <p>
                        Dear @CustomerName@, <br /> <br />
                        The following support ticket has been updated: :
                    </p>
                    <table>

                        <tbody>
                            <tr>
                                <td>Ticket #:</td>
                                <td>@TicketNumber@</td>
                            </tr>
                            <tr>
                                <td>Customer Email :</td>
                                <td>@CustomerEmail@</td>
                            </tr>
                            <tr>
                                <td>Created On : </td>
                                <td>@CreatedOn@</td>
                            </tr>
                            <tr>
                                <td>Last Updated On : </td>
                                <td>@LastUpdatedOn@</td>
                            </tr>
                            <!--<tr>
                                <td>Subject : </td>
                                <td>@SubjectTitle@</td>
                            </tr>-->
                            <tr>
                                <td>Status : </td>
                                <td>@Status@</td>
                            </tr>
                            <tr>
                                <td>Comment : </td>
                                <td>@Comment@</td>
                            </tr>
                        </tbody>
                    </table>

                    <br />
                    <table cellspacing="0" cellpadding="0" border="0" align="center" width="100%" style="background:#311d12;margin-top:25px;">
                        <tbody>
                            <tr>
                                <td style="padding:15px;">

                                    <p style="font-family: Calibri, Helvetica, sans-serif;font-size:11pt;margin-top:0;margin-bottom:0px;color:#eee;text-align:center">Copyright © 2022 All Rights Reserved</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
